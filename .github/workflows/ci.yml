name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, lint, unit test, build, e2e
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Typecheck (strict)
        run: npm run typecheck

      - name: Lint
        # Pelanggaran lama dicatat di eslint-suppressions.json; hanya pelanggaran baru yang gagal.
        run: npm run lint

      - name: Unit test
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Chromium
        run: npx playwright-core install --with-deps chromium

      - name: End-to-end test
        # Database SQLite sementara + gateway pembayaran tiruan; tidak butuh secret apa pun.
        run: npm run test:e2e
